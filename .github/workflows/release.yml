name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      ORG_GRADLE_PROJECT_helperTargets: aarch64-apple-darwin,x86_64-apple-darwin,aarch64-unknown-linux-gnu,x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag
        run: |
          version="$(sed -n 's/^version = //p' gradle.properties)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in gradle.properties"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Set up Rust
        run: rustup target add x86_64-apple-darwin aarch64-unknown-linux-gnu x86_64-unknown-linux-gnu

      - uses: mlugg/setup-zig@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Check and verify
        run: ./gradlew check verifyPlugin buildPlugin

      - name: Upload verifier reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pluginVerifier
          path: build/reports/pluginVerifier

      - name: Publish to JetBrains Marketplace
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: ./gradlew publishPlugin

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./gradlew getChangelog --no-header --no-empty-sections --console=plain -q \
            --output-file=build/release-notes.md
          gh release create "$GITHUB_REF_NAME" build/distributions/*.zip \
            --title "$VERSION" --notes-file build/release-notes.md
